<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Tai chuột to, xếp chồng lớp -->
  <circle cx="20" cy="30" r="22" fill="#a0a0a0" />
  <circle cx="20" cy="30" r="12" fill="#ffc0cb" />
  
  <circle cx="80" cy="30" r="22" fill="#a0a0a0" />
  <circle cx="80" cy="30" r="12" fill="#ffc0cb" />

  <!-- Khuôn mặt trung tâm -->
  <ellipse cx="50" cy="60" rx="35" ry="30" fill="#c0c0c0" />

  <!-- Mắt trái (kích thước lớn, nhìn xuống) -->
  <circle cx="35" cy="50" r="14" fill="white" />
  <circle cx="35" cy="53" r="4" fill="black" />

  <!-- Mắt phải (kích thước nhỏ, lệch tâm) -->
  <circle cx="65" cy="45" r="9" fill="white" />
  <circle cx="62" cy="44" r="3" fill="black" />

  <!-- Mũi và răng cửa -->
  <ellipse cx="50" cy="68" rx="8" ry="6" fill="#ff69b4" />
  <rect x="43" y="74" width="6" height="10" fill="white" stroke="#333" stroke-width="1" />
  <rect x="51" y="74" width="6" height="10" fill="white" stroke="#333" stroke-width="1" />

  <!-- Râu chuột (sử dụng đường cong Bézier) -->
  <path d="M 10 60 Q 25 65 35 65" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 12 70 Q 25 70 35 68" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 90 60 Q 75 65 65 65" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 88 70 Q 75 70 65 68" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
